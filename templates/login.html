<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('login.page_title') }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="/i18n.js"></script>
    <script src="/static/js/common.js"></script>
</head>
<body class="matchday-page">
    <button class="lang-toggle" id="lang-toggle" aria-label="Switch language"></button>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"></button>
    <div class="login-container">
        <form class="login-form" method="POST" action="/admin/login">
            <div class="login-header">
                <h1>Tennis Scoring</h1>
                <p>{{ t('login.title') }}</p>
            </div>

            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}

            <div class="form-group">
                <label for="email">{{ t('login.email') }}</label>
                <input type="email" id="email" name="email" required autofocus autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">{{ t('login.password') }}</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login">{{ t('login.submit') }}</button>
        </form>

        <div class="login-footer-links">
            <a href="/register">{{ t('login.create_account') }}</a>
            <span class="login-link-sep">&middot;</span>
            <a href="/archive">{{ t('nav.archive') }}</a>
        </div>
    </div>
<a href="/faq" class="faq-link">FAQ</a>
<div class="version-label">v{{ app_version }}</div>
</body>
</html>
