<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Tennis Scoring</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="/static/js/common.js"></script>
</head>
<body class="matchday-page">
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"></button>
    <div class="login-container">
        <form class="login-form" method="POST" action="/register">
            <div class="login-header">
                <h1>Tennis Scoring</h1>
                <p>Create your account</p>
            </div>

            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus autocomplete="email"
                       value="{{ email or '' }}">
            </div>

            <div class="form-group">
                <label for="display_name">Display Name <span class="form-hint">(optional)</span></label>
                <input type="text" id="display_name" name="display_name" autocomplete="name"
                       value="{{ display_name or '' }}">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="new-password"
                       minlength="6">
                <span class="form-hint">At least 6 characters</span>
            </div>

            <button type="submit" class="btn-login">Create Account</button>
        </form>

        <div class="login-footer-links">
            <a href="/admin/login">Already have an account? Log in</a>
            <span class="login-link-sep">&middot;</span>
            <a href="/archive">View Archive</a>
        </div>
    </div>
<div class="version-label">v{{ app_version }}</div>
</body>
</html>
